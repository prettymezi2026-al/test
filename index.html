<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관용표현 퀴즈 — PencilBooth Style</title>
  <meta name="description" content="초등학교 6학년 국어 교과서 관용표현을 4지선다 퀴즈로 재미있게 풀고 100점 만점 점수와 상세한 오답 해설을 확인해보세요.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Container (PencilBooth Paper Sheet) -->
  <main class="app-container" id="quiz-app">
    
    <!-- 1. HOME / MAIN VIEW -->
    <section id="home-view" class="view-section active">
      <div class="home-content">
        <div class="badge">
          <span>✏️ 초등 6학년 국어 관용표현</span>
        </div>
        <h1 class="home-title">지혜가 쑥쑥!<br>관용표현 퀴즈 노트</h1>
        <p class="home-subtitle">
          교과서 필수 관용표현을 재미있게 풀고<br>나의 국어 실력을 100점 만점으로 확인해보세요.
        </p>

        <!-- Info Cards -->
        <div class="quiz-info-cards">
          <div class="info-card">
            <span class="info-icon">📝</span>
            <div class="info-text">총 문항</div>
            <div class="info-val">5문제</div>
          </div>
          <div class="info-card">
            <span class="info-icon">💯</span>
            <div class="info-text">만점 기준</div>
            <div class="info-val">100점</div>
          </div>
          <div class="info-card">
            <span class="info-icon">💡</span>
            <div class="info-text">학습 지원</div>
            <div class="info-val">즉시 해설</div>
          </div>
        </div>

        <button id="start-btn" class="btn-primary">
          <span>퀴즈 시작하기</span>
          <span style="font-size: 1.1rem;">➔</span>
        </button>
      </div>
    </section>

    <!-- 2. QUIZ PLAY VIEW -->
    <section id="quiz-view" class="view-section">
      <header class="quiz-header">
        <div class="quiz-meta">
          <span id="quiz-step-text" class="quiz-step-text">문제 1 / 5</span>
          <span class="quiz-score-badge">문항당 20점</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </header>

      <!-- Question Content -->
      <article class="question-box">
        <h2 id="question-text" class="question-text">문제가 여기에 표시됩니다.</h2>
      </article>

      <!-- 4 Options -->
      <div id="options-container" class="options-container">
        <!-- JS로 4지선다 버튼 렌더링 -->
      </div>

      <!-- Instant Feedback Box (한 문제 풀 때마다 즉시 해설 출력) -->
      <div id="feedback-box" class="feedback-box">
        <div id="feedback-header" class="feedback-header"></div>
        <div id="feedback-exp" class="feedback-exp"></div>
      </div>

      <!-- Footer Action -->
      <footer class="quiz-footer">
        <button id="next-btn" class="btn-next" disabled>
          <span id="next-btn-text">다음 문제</span>
          <span>➔</span>
        </button>
      </footer>
    </section>

    <!-- 3. RESULT VIEW -->
    <section id="result-view" class="view-section">
      <header class="result-header">
        <div class="score-display-card">
          <div class="score-circle">
            <span id="final-score" class="score-number">0</span>
            <span class="score-max">/ 100점</span>
          </div>
          <h2 id="result-title" class="result-title">수고하셨습니다!</h2>
          <p id="result-subtitle" class="result-subtitle">결과 분석 중입니다...</p>
        </div>
      </header>

      <!-- Review / Wrong Answers Section -->
      <section class="review-section">
        <h3 class="review-title">
          <span>📖 풀이 결과 및 오답 노트</span>
        </h3>
        <div id="review-list" class="review-list">
          <!-- JS로 정답/오답 해설 렌더링 -->
        </div>
      </section>

      <!-- Action Buttons -->
      <footer class="action-buttons">
        <button id="restart-btn" class="btn-restart">
          <span>🔄 다시 도전하기</span>
        </button>
      </footer>
    </section>

  </main>

  <!-- External Quiz Data & App Script -->
  <script src="quizData.js"></script>
  <script src="app.js"></script>
</body>
</html>
